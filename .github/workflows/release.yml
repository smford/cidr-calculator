name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump strategy (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -cover ./...

  release:
    name: Create GitHub Release & Homebrew Formula
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Determine Release Version
        id: version
        run: |
          git fetch --tags --force

          # 1. If triggered by an explicit tag push (refs/tags/v*), use that tag directly
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered by tag push: ${TAG_NAME}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Check if current HEAD is already tagged with a semver release tag
          CURRENT_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | head -n 1)
          if [ -n "$CURRENT_TAG" ]; then
            echo "HEAD is already tagged as ${CURRENT_TAG}. Using existing tag."
            VERSION="${CURRENT_TAG#v}"
            echo "tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Find the latest existing semver tag
          LATEST_TAG=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          echo "Latest existing tag: ${LATEST_TAG:-none}"

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            MANUAL_BUMP="${{ inputs.bump }}"
            BUMP="patch"
            if [ -n "$MANUAL_BUMP" ] && [ "$MANUAL_BUMP" != "auto" ]; then
              BUMP="$MANUAL_BUMP"
            else
              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b")
              if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|breaking:|^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:)"; then
                BUMP="major"
              elif echo "$COMMITS" | grep -qE "^feat(\([a-zA-Z0-9_-]+\))?:"; then
                BUMP="minor"
              fi
            fi

            echo "Determined version bump: ${BUMP}"
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "Next release version: ${NEW_VERSION}"
          echo "Next release tag: ${TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        if: steps.version.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and Publish Homebrew Formula
        if: steps.version.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "dist/cidr-calculator.rb"

          # Upload formula asset to GitHub release
          gh release upload "$TAG_NAME" dist/cidr-calculator.rb --clobber

          # Publish to smford/homebrew-tap if HOMEBREW_TAP_TOKEN is configured
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp dist/cidr-calculator.rb tap_repo/Formula/cidr-calculator.rb
            cd tap_repo
            git add Formula/cidr-calculator.rb
            if git diff --staged --quiet; then
              echo "Formula is already up to date in smford/homebrew-tap."
            else
              git commit -m "feat(formula): update cidr-calculator to ${TAG_NAME}"
              git push origin main
              echo "Successfully published cidr-calculator formula to smford/homebrew-tap."
            fi
          else
            echo "::warning ::HOMEBREW_TAP_TOKEN secret is not set. Skipped pushing to smford/homebrew-tap."
          fi
